<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sobreviventes da Resenha</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: fliperama noturno, pixel art. IDEA: roguelite de horda.
   PICTURE: o próprio jogo. COLOUR: vinho-noite, dourado, menta. TYPE: Press Start 2P + Nunito. LAYOUT: tela cheia. */
html,body{margin:0;height:100%;background:#0d0710;overflow:hidden;font-family:Nunito,system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
canvas#g{display:block;width:100vw;height:100vh;image-rendering:pixelated}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(12,5,14,.86);overflow:auto;padding:16px;box-sizing:border-box}
.hide{display:none}
h1,h2{font-family:'Press Start 2P',monospace;font-weight:400;margin:0 0 10px;text-align:center;line-height:1.3}
h1{font-size:clamp(18px,4vw,40px);color:#ffd166;text-shadow:4px 4px 0 #7a1630}
h2{font-size:clamp(14px,2.6vw,24px);color:#ffd166;text-shadow:3px 3px 0 #7a1630}
.sub{opacity:.8;margin-bottom:16px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,210px));gap:12px}
.card{background:#1e1024;border:3px solid #4a2a52;padding:10px;cursor:pointer;text-align:center;box-shadow:4px 4px 0 #000}
.card:hover,.card:focus{border-color:#ffd166;outline:none;transform:translateY(-3px)}
.card canvas{width:138px;height:222px;image-rendering:pixelated}
.card b{display:block;font-family:'Press Start 2P';font-weight:400;font-size:12px;margin:4px 0}
.wpn{color:#ffd166;font-size:14px;font-weight:900}
.card small{display:block;opacity:.75;font-size:13px;margin-top:3px}
.pas{color:#06d6a0;font-size:13px;margin-top:3px}
.ups{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.up{width:230px;background:#1e1024;border:3px solid #4a2a52;padding:14px;cursor:pointer;text-align:center;box-shadow:4px 4px 0 #000}
.up:hover{border-color:#ffd166;transform:translateY(-3px)}
.up .ic{font-size:34px}.up b{display:block;font-size:17px;margin:6px 0 2px}
.up .lv{color:#06d6a0;font-size:13px;font-weight:900}
.up p{margin:6px 0 0;font-size:14px;opacity:.85}
.btn{margin:16px 6px 0;padding:12px 22px;border:3px solid #000;background:#ffd166;color:#2a0f1c;font-family:'Press Start 2P';font-size:12px;cursor:pointer;min-height:44px;box-shadow:4px 4px 0 #000}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mbtns{display:flex;flex-direction:column;gap:4px;width:min(320px,90vw)}.mbtns .btn{margin:6px 0}.btn:disabled{opacity:.4;cursor:default}
.small{font-size:13px;margin-top:14px}.locked canvas{filter:grayscale(.7) brightness(.7)}.stt{font-weight:900;font-size:13px;margin-top:6px;color:#ffd166}
.mini{margin-top:6px;padding:6px 10px;border:2px solid #000;background:#4a2a52;color:#fff;font:700 12px Nunito;cursor:pointer;display:inline-block;min-height:32px}.mini:disabled{opacity:.5}
.imp{margin-top:4px;font-size:12px}.nq{width:42px;font:700 13px Nunito;margin-left:4px}
.alist{display:grid;gap:10px;width:min(560px,92vw)}.ach{background:#1e1024;border:3px solid #4a2a52;padding:10px 12px;display:grid;gap:4px}.ach.done{border-color:#06d6a0}
.ach span{font-size:14px;opacity:.85}.ach i{display:block;height:8px;background:#2a1530;position:relative}.ach i::after{content:'';position:absolute;inset:0;width:var(--p);background:#ffd166}
.cfgbox{display:grid;gap:14px;width:min(420px,92vw);background:#1e1024;border:3px solid #4a2a52;padding:16px}.cfgbox label{display:grid;gap:6px;font-weight:900}
.cfgbox select{font:700 16px Nunito;padding:8px;min-height:44px}.cfgbox .chk{display:flex;align-items:center;gap:8px}
.ult{font-size:12px;color:#c77dff;margin-top:4px;font-weight:900}#ultb{position:fixed;right:16px;bottom:60px;width:72px;height:72px;border-radius:50%;border:3px solid #000;background:#c77dff;font-size:30px;cursor:pointer;box-shadow:3px 3px 0 #000}
.ov{justify-content:flex-start;touch-action:pan-y;overscroll-behavior:contain}.ov>:first-child{margin-top:auto}.ov>:last-child{margin-bottom:auto}
#rot{display:none;position:fixed;inset:0;z-index:99;background:#0d0710;color:#ffd166;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-family:'Press Start 2P';text-align:center}#rot div{font-size:54px}#rot span{font:700 15px Nunito;color:#fff}
@media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}

<canvas id="g"></canvas><div id="rot"><div>📱↻</div><b>Gire o celular</b><span>O jogo é na horizontal</span></div><button id="ultb" hidden title="Ultimate (Espaço)">⚡</button>
<div id="menu" class="ov"><h1>Sobreviventes<br>da Resenha</h1><div class="sub" id="coins"></div><div class="mbtns">
<button class="btn" data-a="play">Jogar</button><button class="btn" data-a="cont" id="mcont">Continuar</button><button class="btn" data-a="chars">Personagens</button><button class="btn" data-a="unl">Desbloqueáveis</button><button class="btn" data-a="cfg">Configurações</button><button class="btn" data-a="quit">Sair do jogo</button></div>
<div class="sub small">WASD / setas ou arraste · Esc ou P pausa · sobreviva 10 minutos</div></div>
<div id="sel" class="ov hide"><h2 id="selt">Escolha seu personagem</h2><div class="sub" id="coins2"></div><div class="grid" id="grid"></div><button class="btn" data-a="back">Voltar</button></div>
<div id="unl" class="ov hide"><h2>Desbloqueáveis</h2><div id="alist" class="alist"></div><button class="btn" data-a="back">Voltar</button></div>
<div id="cfg" class="ov hide"><h2>Configurações</h2><div class="cfgbox">
<label>Gráfico (resolução)<select id="cres"><option value="1">100% · Nítido</option><option value="0.75">75%</option><option value="0.5">50% · Retrô</option></select></label>
<label>Modo de tela<select id="cmode"><option value="win">Janela</option><option value="full">Tela cheia</option></select></label>
<label>Idioma / legendas<select disabled><option>Português (Brasil)</option><option>English · em breve</option><option>Español · em breve</option></select></label>
<label>Zoom da câmera (tamanho dos personagens)<select id="czoom"><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="1.75">175%</option></select></label>
<label>Efeitos sonoros<input type="range" id="csfx" min="0" max="1" step="0.05"></label>
<label>Música<input type="range" id="cmus" min="0" max="1" step="0.05"></label>
<label class="chk"><input type="checkbox" id="ctest"> Modo tester (todos os personagens liberados)</label>
<button class="mini" id="creset">Apagar progresso</button><div id="cmsg" class="sub small"></div></div><button class="btn" data-a="back">Voltar</button></div>
<div id="pause" class="ov hide"><h2>Pausado</h2><div class="mbtns"><button class="btn" data-a="resume">Continuar</button><button class="btn" data-a="cfg">Configurações</button><button class="btn" data-a="menu">Menu principal</button></div></div>
<div id="bye" class="ov hide"><h1>Até a próxima!</h1><div class="sub">Pode fechar esta aba para sair.</div><button class="btn" data-a="back">Voltar ao menu</button></div><div id="lvl" class="ov hide"><h2 id="lvt">Subiu de nível!</h2><div class="sub">Escolha uma melhoria</div><div class="ups" id="ups"></div></div>
<div id="dead" class="ov hide"><h1 id="dt">Você caiu!</h1><div id="ds" class="sub"></div><div><button class="btn hide" id="cont">Continuar (infinito)</button><button class="btn" id="again">Menu</button></div></div>

function start(id){
 P={id,uc:0,x:0,y:0,hp:100,maxHp:100,inv:0,fa:0,face:1,mv:0,t:0,lv:1,xp:0,need:6,lazy:0,orb:[],aura:0,flare:3,
  st:{dmg:1,area:1,cd:1,spd:1,mag:1,xp:1,reg:0,amt:0},w:[{id:CHARS[id].w,l:1,c:.4}]};
 CHARS[id].ap(P);E=[];B=[];G=[];FX=[];PT=[];TX=[];Z=[];HZ=[];TM=[];time=0;kills=0;spawnT=0;bossT=90;evT=100;pend=0;endless=0;curB=-1;runBoss=0;
 show('');st='play';
}
const d2=(a,b)=>(a.x-b.x)**2+(a.y-b.y)**2;
function nearest(i=0){if(!E.length)return null;if(i==0){let m=null,d=1e12;for(const e of E){const q=d2(e,P);if(q<d){d=q;m=e}}return m}
 const s=E.slice().sort((a,b)=>d2(a,P)-d2(b,P));return s[i%s.length]}
function aimAng(){const e=nearest();return e?Math.atan2(e.y-P.y+30,e.x-P.x):P.fa}
function shot(o){o.x=P.x;o.y=P.y-30;o.vx=Math.cos(o.a)*o.v;o.vy=Math.sin(o.a)*o.v;o.r*=A();o.t=0;o.hit=new Map();B.push(o)}
function hurt(e,d,kx=0,ky=0){if(e.hp<=0)return;sfx('hit',.05);d*=P.st.dmg*(e.vul>0?1.3:1);e.hp-=d;e.fl=.1;if(!e.boss){e.x+=kx;e.y+=ky}
 if(TX.length<120)TX.push({x:e.x+rnd(-6,6),y:e.y-e.h-4,s:Math.round(d),t:0,col:e.vul>0?'#d9a8ff':'#fff'})}
function boom(x,y,R,dm,col){sfx('boom',.08);FX.push({k:'boom',x,y,R,t:0,life:.35,col});for(const e of E)if(d2(e,{x,y})<(R+e.r)**2)hurt(e,dm,(e.x-x)*.1,(e.y-y)*.1)}
function wind(side,dm,R,Hh){const y=P.y-30;FX.push({k:'wind',x:P.x,y,side,R,H:Hh,t:0,life:.32});
 for(const e of E){const dx=(e.x-P.x)*side,dy=(e.y-e.h/2)-y;if(dx>-20&&dx<R&&Math.abs(dy)<Hh+e.r)hurt(e,dm,side*18,0)}}
function blade(a,dm,Hh){sfx('wind',.1);B.push({k:'windp',x:P.x+Math.cos(a)*14,y:P.y-34+Math.sin(a)*14,a,vx:Math.cos(a)*600,vy:Math.sin(a)*600,v:600,r:Hh,H:Hh,dmg:dm,pier:999,life:.6,t:0,hit:new Map(),hitcd:9})}
function pulse(R,dm,col){FX.push({k:'ring',x:P.x,y:P.y-20,R,t:0,life:.4,col});for(const e of E){const dx=e.x-P.x,dy=e.y-P.y,d=Math.hypot(dx,dy)||1;if(d<R+e.r)hurt(e,dm,dx/d*30,dy/d*30)}}
function cut(R,dm){FX.push({k:'cut',x:P.x,y:P.y-30,R,t:0,life:.4});for(const e of E){const dx=e.x-P.x,dy=e.y-e.h/2-P.y+30,d=Math.hypot(dx,dy)||1;if(d<R+e.r)hurt(e,dm,dx/d*22,dy/d*22)}}
function cone(a,R,w,dm){FX.push({k:'cone',x:P.x,y:P.y-30,a,R,w,t:0,life:.35});
 for(const e of E){const dx=e.x-P.x,dy=e.y-P.y+30,d=Math.hypot(dx,dy);let da=Math.atan2(dy,dx)-a;da=Math.atan2(Math.sin(da),Math.cos(da));if(d<R+e.r&&Math.abs(da)<w)hurt(e,dm,dx/d*25,dy/d*25)}}
function swing(a,dm,R,l){FX.push({k:'sw',a,R,t:0,life:.3,x:P.x,y:P.y-26});
 for(const e of E){const dx=e.x-P.x,dy=e.y-P.y+26,d=Math.hypot(dx,dy);let da=Math.atan2(dy,dx)-a;da=Math.atan2(Math.sin(da),Math.cos(da));if(d<R+e.r&&Math.abs(da)<1.35)hurt(e,dm,dx/d*45,dy/d*45)}
 if(l>=6)later(.15,()=>boom(P.x+Math.cos(a)*R*.85,P.y-26+Math.sin(a)*R*.85,60*A(),dm*.7,'#c08a52'))}
function hitP(d){if(P.inv>0)return;sfx('hurt');P.hp-=d*(1+time/300);P.inv=.4;shake=6;burst(P.x,P.y-30,'#ff2d55',6)}
function burst(x,y,col,n=8){for(let i=0;i<n;i++){const a=Math.random()*TAU,s=rnd(40,170);PT.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:0,life:rnd(.3,.6),col,r:rnd(2,4)})}}
function spawn(id,x,y,kind){const M=MOBS[id],m=1+time/50+(time/200)**2,sc=kind=='boss'?4:kind=='elite'?2.25:1.5;
 if(x===undefined){const a=Math.random()*TAU,R=Math.hypot(W,H)/2/ZM+60;x=P.x+Math.cos(a)*R;y=P.y+Math.sin(a)*R}
 const hpb=kind=='boss'?(id=='leao'?40000:900+time*6):kind=='elite'?M.hp*6:M.hp;
 E.push({id,x,y,sc,boss:kind=='boss',elite:kind=='elite',hp:hpb*m,mhp:hpb*m,spd:M.spd*(kind=='boss'?.6:1),dmg:M.dmg*(kind=='boss'?2:1),xp:kind=='boss'?40:kind=='elite'?M.xp*8:M.xp,b:M.b,
  w:M.spr.width*sc,h:M.spr.height*sc,r:M.spr.width*sc*.36,fl:0,dt:0,dot:0,vul:0,slow:0,ph:Math.random()*6,oc:0,ac:0,dash:0,cd:rnd(1,3)})}

function openLevel(title){st='lvl';sfx('lvl');document.getElementById('lvt').textContent=title||'Subiu de nível!';const pool=[];
 for(const w of P.w)if(w.l<8)pool.push({ic:WEAP[w.id].ic,n:WEAP[w.id].n,lv:'Nível '+(w.l+1),d:WEAP[w.id].up[w.l-1],f:()=>w.l++,wt:3});
 if(P.w.length<6)for(const k in WEAP)if(!P.w.find(w=>w.id==k))pool.push({ic:WEAP[k].ic,n:WEAP[k].n,lv:'NOVA ARMA',d:WEAP[k].d,f:()=>P.w.push({id:k,l:1,c:.3}),wt:1});
 for(const p of PAS)pool.push({ic:p.ic,n:p.n,lv:'Passiva',d:p.d,f:()=>p.f(P),wt:1});
 const pick=[];while(pick.length<3&&pool.length){let s=pool.reduce((a,o)=>a+o.wt,0)*Math.random(),i=0;while((s-=pool[i].wt)>0)i++;pick.push(pool.splice(i,1)[0])}
 if(!pick.length){P.hp=P.maxHp;pend--;st='play';return}
 const box=document.getElementById('ups');box.innerHTML='';
 for(const o of pick){const d=document.createElement('div');d.className='up';
  const ic=document.createElement('div');ic.className='ic';ic.textContent=o.ic;const b=document.createElement('b');b.textContent=o.n;
  const lv=document.createElement('div');lv.className='lv';lv.textContent=o.lv;const p=document.createElement('p');p.textContent=o.d;d.append(ic,b,lv,p);
  d.onclick=()=>{o.f();pend--;document.getElementById('lvl').classList.add('hide');if(pend>0)openLevel();else st='play'};box.append(d)}
 document.getElementById('lvl').classList.remove('hide');
}
function end(win){st='dead';sfx(win?'chest':'over');document.getElementById('dt').textContent=win?'Sobreviveu!':'Você caiu!';
 const m=Math.floor(time/60),s=Math.floor(time%60);
 document.getElementById('ds').textContent=CHARS[P.id].name+' · '+m+':'+String(s).padStart(2,'0')+' · nível '+P.lv+' · '+kills+' abates'+(win?' · Agora o Leão da Receita vem te buscar…':'')+reward(win);
 document.getElementById('cont').classList.toggle('hide',!win);document.getElementById('dead').classList.remove('hide')}
document.getElementById('again').onclick=()=>{P=null;st='menu';show('menu')};
document.getElementById('cont').onclick=()=>{document.getElementById('dead').classList.add('hide');endless=1;st='play';spawn('leao',undefined,undefined,'boss')};

let AC=null,SFXG=null,MUSG=null;const lastS={};
function audioInit(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();SFXG=AC.createGain();MUSG=AC.createGain();SFXG.connect(AC.destination);MUSG.connect(AC.destination);audioVol()}catch(e){AC=null}}
function audioVol(){if(!AC)return;SFXG.gain.value=(S.sfx??.7)*.5;MUSG.gain.value=(S.mus??.4)*.25}
function tone(f,d,type='square',v=.3,slide=0,when=0,g=SFXG){if(!AC)return;const t=AC.currentTime+when,o=AC.createOscillator(),a=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);
 a.gain.setValueAtTime(v,t);a.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(a);a.connect(g);o.start(t);o.stop(t+d+.02)}
function noise(d,v=.3,hp=800,when=0){if(!AC)return;const t=AC.currentTime+when,n=AC.sampleRate*d,b=AC.createBuffer(1,n,AC.sampleRate),ch=b.getChannelData(0);for(let i=0;i<n;i++)ch[i]=Math.random()*2-1;
 const s=AC.createBufferSource(),f=AC.createBiquadFilter(),a=AC.createGain();s.buffer=b;f.type='bandpass';f.frequency.setValueAtTime(hp,t);f.frequency.exponentialRampToValueAtTime(hp*.3,t+d);a.gain.setValueAtTime(v,t);a.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(a);a.connect(SFXG);s.start(t)}
const SFX={
 hit:()=>noise(.06,.12,2400),
 kill:()=>{tone(520,.08,'square',.08,.5)},
 gem:()=>{const p=1+Math.random()*.2;tone(1200*p,.06,'triangle',.12,1.5)},
 lvl:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.14,'square',.15,1,i*.08))},
 hurt:()=>{tone(180,.18,'sawtooth',.25,.4);noise(.12,.2,600)},
 ult:()=>{noise(.6,.35,300);[262,330,392,523].forEach((f,i)=>tone(f,.5,'sawtooth',.12,1,i*.04))},
 boss:()=>{tone(110,.9,'sawtooth',.3,.7);tone(116,.9,'sawtooth',.2,.7)},
 wind:()=>noise(.25,.18,3200),
 boom:()=>{noise(.3,.3,500);tone(90,.25,'sine',.35,.4)},
 chest:()=>{[784,988,1175,1568].forEach((f,i)=>tone(f,.2,'triangle',.18,1,i*.07))},
 over:()=>{[392,330,262,196].forEach((f,i)=>tone(f,.3,'square',.15,1,i*.18))},
 click:()=>tone(880,.05,'square',.1),
};
function sfx(n,gap=.04){if(!AC||!SFX[n])return;const t=AC.currentTime;if(lastS[n]&&t-lastS[n]<gap)return;lastS[n]=t;SFX[n]()}
/* música chiptune simples */
const SONG={bass:[45,45,48,43,45,45,41,43],lead:[69,72,76,72,69,74,72,67, 69,72,76,79,77,76,74,72]};let musStep=0,musT=0;
const mf=n=>440*2**((n-69)/12);
function musicTick(dt){if(!AC||st!='play'||(S.mus??.4)<=0)return;musT-=dt;if(musT>0)return;musT=.2;const s=musStep++;
 if(s%4==0)tone(mf(SONG.bass[(s>>2)%8]-12),.35,'triangle',.5,1,0,MUSG);
 if(s%2==0)tone(mf(SONG.lead[(s>>1)%16]),.16,'square',.12,1,0,MUSG);
 if(s%4==2)noiseM()}
function noiseM(){if(!AC)return;const t=AC.currentTime,n=AC.sampleRate*.05,b=AC.createBuffer(1,n,AC.sampleRate),ch=b.getChannelData(0);for(let i=0;i<n;i++)ch[i]=Math.random()*2-1;const s=AC.createBufferSource(),a=AC.createGain();s.buffer=b;a.gain.setValueAtTime(.15,t);a.gain.exponentialRampToValueAtTime(.001,t+.05);s.connect(a);a.connect(MUSG);s.start(t)}
addEventListener('pointerdown',audioInit,{once:true});addEventListener('keydown',audioInit,{once:true});

const DEF={v:2,zoom:1.5,coins:0,owned:{},tester:true,res:1,stats:{kills:0,best:0,bosses:0,biomes:[],maxLv:0,runs:0},ach:{},spr:{}};
let S;try{S=Object.assign(structuredClone(DEF),JSON.parse(localStorage.getItem('sdr_save')||'{}'));S.stats=Object.assign(structuredClone(DEF.stats),S.stats)}catch(e){S=structuredClone(DEF)}
if(S.v!==2){S.v=2;S.tester=true;S.zoom=1.5}ZM=S.zoom||1.5;
function save(){try{localStorage.setItem('sdr_save',JSON.stringify(S))}catch(e){}}
const ACH=[
 {id:'s5',n:'Resistente',d:'Sobreviva 5 minutos em uma partida',p:()=>S.stats.best/300,r:120},
 {id:'s10',n:'Lenda da Resenha',d:'Sobreviva 10 minutos',p:()=>S.stats.best/600,r:300},
 {id:'k1000',n:'Exterminador',d:'Derrote 1.000 inimigos no total',p:()=>S.stats.kills/1000,r:150},
 {id:'k10000',n:'Apocalipse',d:'Derrote 10.000 inimigos no total',p:()=>S.stats.kills/10000,r:500},
 {id:'boss',n:'Caçador de Chefões',d:'Derrote 5 chefões no total',p:()=>S.stats.bosses/5,r:200},
 {id:'bio',n:'Turista',d:'Visite os 5 biomas',p:()=>S.stats.biomes.length/5,r:150},
 {id:'lv30',n:'Nível Máximo',d:'Chegue ao nível 30',p:()=>S.stats.maxLv/30,r:180},
];
const unlocked=id=>S.tester||!CHARS[id].price||S.owned[id];
/* sprites importados (fluxo do vídeo: chroma key + normalização de altura + pés no chão) */
function importSprite(id,url,n){const im=new Image();im.onload=()=>{const fw=Math.floor(im.width/n),c=document.createElement('canvas');c.width=im.width;c.height=im.height;const x=c.getContext('2d');x.drawImage(im,0,0);
 const d=x.getImageData(0,0,c.width,c.height),k=[d.data[0],d.data[1],d.data[2]],hasA=d.data[3]<10;
 if(!hasA)for(let i=0;i<d.data.length;i+=4)if(Math.abs(d.data[i]-k[0])+Math.abs(d.data[i+1]-k[1])+Math.abs(d.data[i+2]-k[2])<60)d.data[i+3]=0;x.putImageData(d,0,0);
 const boxes=[];for(let f=0;f<n;f++){let x0=1e9,y0=1e9,x1=-1,y1=-1;for(let y=0;y<c.height;y++)for(let xx=f*fw;xx<(f+1)*fw;xx++)if(d.data[(y*c.width+xx)*4+3]>20){x0=Math.min(x0,xx);x1=Math.max(x1,xx);y0=Math.min(y0,y);y1=Math.max(y1,y)}boxes.push([x0,y0,x1,y1])}
 const mh=Math.max(...boxes.map(b=>b[3]-b[1]+1)),sc=66/mh;
 const frs=boxes.map(([x0,y0,x1,y1])=>{const o=document.createElement('canvas');o.width=Math.ceil(fw*sc)+2;o.height=GH;const ox=o.getContext('2d');ox.imageSmoothingEnabled=false;
  if(x1>=0){const w=(x1-x0+1)*sc,h=(y1-y0+1)*sc;ox.drawImage(c,x0,y0,x1-x0+1,y1-y0+1,Math.round(o.width/2-w/2),Math.round(GH-2-h),Math.round(w),Math.round(h))}return o});
 CHARS[id].custom=frs;S.spr[id]={url,n};save()};im.src=url}
for(const id in S.spr)if(CHARS[id])importSprite(id,S.spr[id].url,S.spr[id].n);
function frames(id,mv){const D=CHARS[id];if(D.custom)return mv?D.custom:[D.custom[0]];return mv?D.walk:D.idle}

/* ---------- TELAS ---------- */
const $=id=>document.getElementById(id),OVS=['menu','sel','unl','cfg','pause','bye','lvl','dead'];let selMode='play',backTo='menu';
function show(id){for(const o of OVS)$(o).classList.toggle('hide',o!==id);if(id=='menu'){$('coins').textContent='🪙 '+S.coins+' moedas'+(S.tester?' · modo tester':'');$('mcont').disabled=!(P&&st=='menu')}
 if(id=='sel')buildGrid();if(id=='unl')buildAch();if(id=='cfg')syncCfg()}
function goLand(){if(!matchMedia('(pointer:coarse)').matches)return;try{const d=document.documentElement,p=d.requestFullscreen?d.requestFullscreen():null;if(p)p.then(()=>screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})).catch(()=>{})}catch(e){}}
function act(a){audioInit();sfx('click');if(a=='play')goLand();
 if(a=='play'){selMode='play';$('selt').textContent='Escolha seu personagem';show('sel')}
 else if(a=='chars'){selMode='chars';$('selt').textContent='Personagens';show('sel')}
 else if(a=='cont'){if(P){show('');st='play'}}
 else if(a=='unl')show('unl');
 else if(a=='cfg'){backTo=st=='pause'?'pause':'menu';show('cfg')}
 else if(a=='quit'){show('bye')}
 else if(a=='back')show(backTo=='pause'&&st=='pause'?'pause':'menu'),backTo='menu';
 else if(a=='resume'){show('');st='play'}
 else if(a=='menu'){st='menu';show('menu')}
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&!b.disabled)act(b.dataset.a)});
function buildGrid(){const grid=$('grid');grid.innerHTML='';cards.length=0;$('coins2').textContent='🪙 '+S.coins+' moedas';
 for(const id in CHARS){const D=CHARS[id],Wp=WEAP[D.w],ok=unlocked(id),d=document.createElement('div');d.className='card'+(ok?'':' locked');d.tabIndex=0;
  const cvs=document.createElement('canvas');cvs.width=92;cvs.height=148;
  const b=document.createElement('b');b.textContent=D.name;const wp=document.createElement('div');wp.className='wpn';wp.textContent=Wp.ic+' '+Wp.n;
  const sm=document.createElement('small');sm.textContent=Wp.d;const ps=document.createElement('div');ps.className='pas';ps.textContent='★ '+D.pas;const ul=document.createElement('div');ul.className='ult';ul.textContent='ULT '+ULT[id].ic+' '+ULT[id].n+': '+ULT[id].d;
  const stt=document.createElement('div');stt.className='stt';stt.textContent=ok?(S.tester&&D.price&&!S.owned[id]?'Liberado (tester)':'✔ Liberado'):'🔒 '+D.price+' moedas';
  d.append(cvs,b,wp,sm,ps,ul,stt);
  if(!ok){const bb=document.createElement('button');bb.className='mini';bb.textContent=S.coins>=D.price?'Comprar':'Moedas insuficientes';bb.disabled=S.coins<D.price;
   bb.onclick=ev=>{ev.stopPropagation();S.coins-=D.price;S.owned[id]=1;save();buildGrid()};d.append(bb)}
  if(selMode=='chars'){const lab=document.createElement('label');lab.className='mini';lab.textContent='Importar sprite (PNG)';const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.hidden=true;
   const nq=document.createElement('input');nq.type='number';nq.min=1;nq.max=16;nq.value=S.spr[id]?S.spr[id].n:8;nq.className='nq';nq.title='Quadros na folha';nq.onclick=ev=>ev.stopPropagation();
   inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>importSprite(id,r.result,Math.max(1,+nq.value||1));r.readAsDataURL(f)};lab.append(inp);lab.onclick=ev=>ev.stopPropagation();
   const row=document.createElement('div');row.className='imp';row.append(lab,nq,document.createTextNode(' quadros'));d.append(row);
   if(S.spr[id]){const rm=document.createElement('button');rm.className='mini';rm.textContent='Usar sprite original';rm.onclick=ev=>{ev.stopPropagation();delete S.spr[id];delete CHARS[id].custom;save()};d.append(rm)}}
  d.onclick=()=>{if(selMode=='play'&&unlocked(id))start(id)};d.onkeydown=e=>{if(e.key=='Enter')d.onclick()};grid.append(d);cards.push({id,c:cvs.getContext('2d')})}}
function buildAch(){const l=$('alist');l.innerHTML='';for(const a of ACH){const p=Math.min(1,a.p()),r=document.createElement('div');r.className='ach'+(S.ach[a.id]?' done':'');
 const t=document.createElement('b');t.textContent=(S.ach[a.id]?'✔ ':'')+a.n;const dd=document.createElement('span');dd.textContent=a.d+' · recompensa 🪙 '+a.r;
 const bar=document.createElement('i');bar.style.setProperty('--p',(p*100).toFixed(0)+'%');r.append(t,dd,bar);l.append(r)}
 const h=document.createElement('p');h.className='sub';h.textContent='Personagens novos são comprados com moedas em "Personagens". Moedas: abates, tempo sobrevivido, chefões e conquistas.';l.append(h)}
$('czoom').onchange=e=>{S.zoom=+e.target.value;ZM=S.zoom;save()};
$('csfx').oninput=e=>{S.sfx=+e.target.value;audioVol();save();sfx('click')};$('cmus').oninput=e=>{S.mus=+e.target.value;audioVol();save()};
function syncCfg(){$('csfx').value=S.sfx??.7;$('cmus').value=S.mus??.4;$('czoom').value=S.zoom;$('cres').value=S.res;$('cmode').value=document.fullscreenElement?'full':'win';$('ctest').checked=S.tester}
window.__res=S.res;rs();
$('cres').onchange=e=>{S.res=+e.target.value;window.__res=S.res;save();rs()};
$('cmode').onchange=e=>{if(e.target.value=='full'){const p=document.documentElement.requestFullscreen?document.documentElement.requestFullscreen():null;if(p)p.catch(()=>{$('cmsg').textContent='O navegador bloqueou a tela cheia aqui. Use F11.';e.target.value='win'})}else if(document.fullscreenElement)document.exitFullscreen()};
$('ctest').onchange=e=>{S.tester=e.target.checked;save()};
$('creset').onclick=()=>{const t=S.tester;S=structuredClone(DEF);S.tester=t;save();$('cmsg').textContent='Progresso apagado.'};
function reward(win){const earned=Math.floor(kills/15)+Math.floor(time/10)+runBoss*30+(win?150:0);S.coins+=earned;S.stats.runs++;S.stats.kills+=kills;S.stats.best=Math.max(S.stats.best,time);S.stats.bosses+=runBoss;S.stats.maxLv=Math.max(S.stats.maxLv,P.lv);
 const got=[];for(const a of ACH)if(!S.ach[a.id]&&a.p()>=1){S.ach[a.id]=1;S.coins+=a.r;got.push(a.n+' (+'+a.r+')')}save();return' · 🪙 +'+earned+' moedas'+(got.length?' · Conquista: '+got.join(', '):'')}
const cards=[];
function drawCards(t){for(const k of cards){const c=k.c,fr=frames(k.id,1),img=fr[Math.floor(t*10)%fr.length];c.imageSmoothingEnabled=false;c.clearRect(0,0,92,148);c.fillStyle='rgba(0,0,0,.35)';c.beginPath();c.ellipse(46,135,22,5,0,0,TAU);c.fill();
 c.drawImage(img,46-img.width,148-img.height*2,img.width*2,img.height*2)}}
show('menu');

document.getElementById('ultb').onclick=e=>{e.stopPropagation();useUlt()};
function loop(ts){{const ub=document.getElementById('ultb');ub.hidden=st!='play';if(P&&st=='play'){ub.textContent=ULT[P.id].ic;ub.style.opacity=P.uc>=ultNeed()?1:.45}}const dt=Math.min(.033,(ts-last)/1000||0);last=ts;if(st=='play')update(dt);if(st!=='play'&&!P)time+=dt;render();if(!$('sel').classList.contains('hide'))drawCards(ts/1000);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
}
</script></body></html>
